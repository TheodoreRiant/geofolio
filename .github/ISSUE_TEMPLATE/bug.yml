name: Bug report
description: Something on the map or in the admin does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: What you see, with a screenshot if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Geofolio 1.1.0, WordPress 6.8, PHP 8.2, Elementor 3.x"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows / Safari iOS 19…
