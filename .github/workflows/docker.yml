name: Docker image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GEOFOLIO_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ghcr.io/theodoreriant/geofolio:${{ steps.version.outputs.tag }}
            ghcr.io/theodoreriant/geofolio:latest
          annotations: |
            index:org.opencontainers.image.source=https://github.com/TheodoreRiant/geofolio
